name: Build and Deploy to Organization Repos

on:
  push:
    branches:
      - feature-unique_urls
  workflow_dispatch:

jobs:
  list-sites:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: set-matrix
        shell: bash
        run: |
          sites=$(ls -d content/*/ | xargs -n 1 basename)
          json_array=$(echo "$sites" | jq -R . | jq -s -c .)
          echo "matrix={\"site\": $json_array}" >> $GITHUB_OUTPUT

  deploy:
    needs: list-sites
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.list-sites.outputs.matrix) }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Provision Repository for ${{ matrix.site }}
        env:
          GH_TOKEN: ${{ secrets.LUKE_QUARTZ_ORG_ADMIN_TOKEN }}
          ORG_NAME: luke-quartz
        shell: bash
        run: |
          repo_name="${{ matrix.site }}"
          echo "Checking for repository: $ORG_NAME/$repo_name"
          if gh repo view "$ORG_NAME/$repo_name" >/dev/null 2>&1; then
            echo "Repository $ORG_NAME/$repo_name already exists. Skipping."
          else
            echo "Repository $ORG_NAME/$repo_name does not exist. Creating..."
            gh repo create "$ORG_NAME/$repo_name" --public --description "Deployment target for the '${{ matrix.site }}' Quartz site."
            echo "Successfully created repository $ORG_NAME/$repo_name."
          fi

      - name: Build Site - ${{ matrix.site }}
        run: npx quartz build --directory "content/${{ matrix.site }}"

      - name: Deploy to luke-quartz/${{ matrix.site }}
        uses: peaceiris/actions-gh-pages@v4
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the directory that contains all the built sites
          path: ./all-sites

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
